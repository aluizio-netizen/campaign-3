# Render Blueprint — Missão Inglês
# Para usar: conecte o repositório no Render e selecione "Blueprint".
# O provider do Prisma é ajustado automaticamente pela env DATABASE_PROVIDER
# (definida como "postgresql" abaixo) — não é preciso editar o schema.
#
# O banco é um Postgres externo (Supabase, schema "missao_ingles") porque o
# Postgres free do Render expira em 30 dias. A DATABASE_URL é definida
# manualmente no dashboard do Render (sync: false).

services:
  - type: web
    name: missao-ingles
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx prisma db push --skip-generate && npm run db:import-media && npm run start
    healthCheckPath: /
    envVars:
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_URL
        sync: false # Postgres externo (Supabase) — definir no dashboard
      - key: NEXT_PUBLIC_MEDIA_BASE_URL
        sync: false # URL do bucket R2/S3/CDN onde você subiu public/media
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false # defina com a URL pública do serviço (ex.: https://missao-ingles.onrender.com)
      - key: AI_PROVIDER
        value: demo
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@missaoingles.com
      - key: ADMIN_PASSWORD
        sync: false # defina uma senha forte
      - key: DEMO_STUDENT_EMAIL
        value: aluno@missaoingles.com
      - key: DEMO_STUDENT_PASSWORD
        sync: false
